[project]
name = "bamaq-transactions"
version = "0.1.0"
description = "Processamento assíncrono de transações - desafio BAMAQ Capital"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43.0",
    "alembic>=1.13",
    "confluent-kafka>=2.5",
    "redis>=5.0",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "fakeredis>=2.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requer infraestrutura do docker compose (mysql/kafka/redis)",
    "e2e: requer aplicacao completa rodando via docker compose",
]
addopts = "-m 'not integration and not e2e'"

[tool.ruff]
line-length = 100
